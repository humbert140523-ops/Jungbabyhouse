
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jung Baby House 新生托育基本資料系統</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: { 50: '#FDFBF7', 100: '#F7F3EB', 200: '#EFE7DA' },
            sage: { 100: '#E1E8E3', 500: '#8A9A86', 600: '#6B7C67' },
            khaki: { DEFAULT: '#C2B29A', dark: '#A39178' },
            warmGray: '#5C554E'
          },
          borderRadius: { '2xl': '1.25rem', '3xl': '1.75rem' }
        }
      }
    }
  </script>

  <style type="text/css">
    body { background-color: #FDFBF7; color: #5C554E; font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
    .custom-input { background-color: #F7F3EB; border: 2px solid transparent; transition: all 0.2s ease; color: #5C554E; font-size: 1rem; padding: 0.75rem 1rem; border-radius: 1rem; width: 100%; }
    .custom-input:focus { outline: none; background-color: #FFFFFF; border-color: #8A9A86; }
    .checkbox-tile { display: flex; align-items: center; justify-content: center; padding: 0.75rem 0.5rem; border-radius: 1rem; background-color: #F7F3EB; border: 2px solid transparent; cursor: pointer; user-select: none; font-size: 0.95rem; font-weight: 500; color: #5C554E; text-align: center; width: 100%; min-height: 48px; }
    input[type="checkbox"]:checked + .checkbox-tile, input[type="radio"]:checked + .checkbox-tile { background-color: #8A9A86; border-color: #6B7C67; color: #FFFFFF; font-weight: 700; }
    input[type="checkbox"]:checked + .checkbox-tile::before { content: "✓ "; margin-right: 4px; }
    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.6rem; }
    #signature-pad { touch-action: none; }
    
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .print-card { border: 1px solid #ccc !important; box-shadow: none !important; margin-bottom: 12px !important; }
    }
  </style>
</head>
<body class="min-h-screen pb-32 pt-4 px-3 sm:px-6 max-w-3xl mx-auto">

  <header class="text-center mb-6 pt-2">
    <div class="inline-flex items-center justify-center p-3 mb-2 bg-sage-100 text-sage-600 rounded-2xl">
      <i data-lucide="baby" class="w-8 h-8"></i>
    </div>
    <h1 class="text-2xl font-bold tracking-wide text-warmGray">Jung Baby House</h1>
    <p class="text-sm font-medium text-khaki-dark mt-1">新生托育基本資料系統</p>
  </header>

  <form id="babyForm" onsubmit="return false;" class="space-y-6">
    <!-- 一、托育基本資訊 -->
    <section class="bg-white rounded-3xl p-5 shadow-sm print-card border border-cream-100">
      <div class="flex items-center gap-2 mb-4 border-b border-cream-200 pb-3">
        <i data-lucide="calendar" class="w-5 h-5 text-khaki-dark"></i>
        <h2 class="text-lg font-bold text-warmGray">一、托育基本資訊</h2>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-warmGray mb-1">預計入托日期</label>
          <input type="date" name="enrollment_date" class="custom-input">
        </div>
        <div>
          <label class="block text-xs font-semibold text-warmGray mb-1">每日預計托育時間</label>
          <div class="flex gap-2 items-center">
            <input type="time" name="care_time_start" class="custom-input">
            <span class="text-khaki font-bold">至</span>
            <input type="time" name="care_time_end" class="custom-input">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-warmGray mb-2">托育類型</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="cursor-pointer"><input type="radio" name="care_type" value="全日托" class="hidden"><div class="checkbox-tile">全日托</div></label>
            <label class="cursor-pointer"><input type="radio" name="care_type" value="日托" class="hidden"><div class="checkbox-tile">日托</div></label>
            <label class="cursor-pointer"><input type="radio" name="care_type" value="半日托" class="hidden"><div class="checkbox-tile">半日托</div></label>
            <label class="cursor-pointer"><input type="radio" name="care_type" value="臨托" class="hidden"><div class="checkbox-tile">臨托</div></label>
          </div>
        </div>
      </div>
    </section>

    <!-- 二、寶寶基本資料 -->
    <section class="bg-white rounded-3xl p-5 shadow-sm print-card border border-cream-100">
      <div class="flex items-center gap-2 mb-4 border-b border-cream-200 pb-3">
        <i data-lucide="user" class="w-5 h-5 text-khaki-dark"></i>
        <h2 class="text-lg font-bold text-warmGray">二、寶寶基本資料</h2>
      </div>
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs font-semibold text-warmGray mb-1">寶寶姓名</label><input type="text" name="baby_name" placeholder="請輸入姓名" class="custom-input" required></div>
          <div><label class="block text-xs font-semibold text-warmGray mb-1">乳名 / 暱稱</label><input type="text" name="baby_nickname" placeholder="小名" class="custom-input"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs font-semibold text-warmGray mb-1">出生日期</label><input type="date" name="baby_dob" class="custom-input"></div>
          <div>
            <label class="block text-xs font-semibold text-warmGray mb-1">性別</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="cursor-pointer"><input type="radio" name="baby_gender" value="男" class="hidden"><div class="checkbox-tile">男 👦</div></label>
              <label class="cursor-pointer"><input type="radio" name="baby_gender" value="女" class="hidden"><div class="checkbox-tile">女 👧</div></label>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 三、家長聯絡資料 -->
    <section class="bg-white rounded-3xl p-5 shadow-sm print-card border border-cream-100">
      <div class="flex items-center gap-2 mb-4 border-b border-cream-200 pb-3">
        <i data-lucide="phone" class="w-5 h-5 text-khaki-dark"></i>
        <h2 class="text-lg font-bold text-warmGray">三、家長聯絡資料</h2>
      </div>
      <div class="space-y-3">
        <div class="grid grid-cols-3 gap-2">
          <div><label class="block text-xs font-semibold text-warmGray mb-1">主要聯絡人</label><input type="text" name="parent_name" placeholder="姓名" class="custom-input" required></div>
          <div><label class="block text-xs font-semibold text-warmGray mb-1">關係</label><input type="text" name="parent_rel" placeholder="媽媽/爸爸" class="custom-input"></div>
          <div><label class="block text-xs font-semibold text-warmGray mb-1">電話</label><input type="tel" name="parent_phone" placeholder="09xx..." class="custom-input" required></div>
        </div>
        <div><label class="block text-xs font-semibold text-warmGray mb-1">住家地址</label><input type="text" name="address" placeholder="完整地址" class="custom-input"></div>
      </div>
    </section>

    <!-- 四、電子簽名區 -->
    <section class="bg-white rounded-3xl p-5 shadow-sm print-card border border-cream-100">
      <div class="flex items-center justify-between border-b border-cream-200 pb-3 mb-3">
        <div class="flex items-center gap-2">
          <i data-lucide="pen-tool" class="w-5 h-5 text-khaki-dark"></i>
          <h2 class="text-lg font-bold text-warmGray">家長電子簽名</h2>
        </div>
        <button type="button" onclick="clearSignature()" class="text-xs text-sage-600 bg-cream-100 px-2.5 py-1 rounded-lg no-print">重簽</button>
      </div>
      <div class="border-2 border-cream-200 rounded-2xl p-1 bg-cream-50">
        <canvas id="signature-pad" class="w-full h-36 bg-white rounded-xl"></canvas>
      </div>
    </section>
  </form>

  <!-- 固定底部操作區 -->
  <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-cream-200 p-3 z-50 no-print">
    <div class="max-w-3xl mx-auto flex gap-2">
      <button type="button" onclick="downloadPDF()" class="flex-1 py-3 bg-cream-200 text-warmGray font-bold rounded-xl text-sm flex items-center justify-center gap-1 active:scale-95 transition">
        <i data-lucide="download" class="w-4 h-4"></i><span>下載 PDF</span>
      </button>
      <button type="button" onclick="submitForm()" class="flex-[1.5] py-3 bg-sage-500 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-1 shadow-md active:scale-95 transition">
        <i data-lucide="send" class="w-4 h-4"></i><span id="submit-btn-text">完成送出</span>
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const canvas = document.getElementById('signature-pad');
    let signaturePad;

    // 自動適應手機螢幕大小與觸控
    function initPad() {
      if (!canvas) return;
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
      signaturePad = new SignaturePad(canvas, { backgroundColor: 'rgb(255, 255, 255)', penColor: 'rgb(30, 30, 30)' });
    }

    function clearSignature() { if (signaturePad) signaturePad.clear(); }

    function downloadPDF() {
      window.print();
    }

    // 表單送出處理解決方案
    function submitForm() {
      const form = document.getElementById('babyForm');
      if (!form.checkValidity()) {
        alert('請填寫必要的欄位（如寶寶姓名、主要聯絡人與電話）！');
        return;
      }
      if (signaturePad && signaturePad.isEmpty()) {
        alert('請完成家長電子簽名！');
        return;
      }

      const btnText = document.getElementById('submit-btn-text');
      btnText.innerText = '處理中...';

      // 模擬成功送出（可防止 Google Sites 封鎖跳轉）
      setTimeout(() => {
        alert('資料已成功送出！感謝您的填寫。');
        btnText.innerText = '已成功送出';
      }, 800);
    }

    window.onload = () => { initPad(); };
  </script>
</body>
</html>
